# A NEVE E O OUTRO MENINO — 50 planos, corte ágil
#
# Continuação de "O menino, o cão e o leão da montanha": mesma montanha, mesmo menino,
# mesmo cão — agora no inverno. Ele conhece a montanha, então a vila o chama para achar
# outro menino que saiu da pista de snowboard.
#
# RITMO (§3): média ~2,2s por plano — corte ágil. A curva é
#   1-8 convocação (rápido, urgente) · 9-20 subida e rastro (cadência de busca)
#   21-34 a pista errada e a queda (acelera) · 35-42 o encontro (respira)
#   43-50 a descida e a vila (alívio, alarga)
#
# NARRAÇÃO EM BLOCO: só 16 dos 50 planos falam, em frases inteiras. Os outros correm
# em ação, música e SFX. (No corte anterior toda plano tinha uma frase curta: 20
# telegramas de 7 palavras, que soaram picotados e incharam o filme.)
#
# Adereço-guia: a MOCHILA VERMELHA (dele) e o CACHECOL LARANJA da vila, que ele amarra
# no galho a cada bifurcação para marcar o caminho de volta — e é por eles que a vila
# encontra os dois no fim.

id: neve-resgate
titulo: "A neve e o outro menino"

formato:
  size: "736x1312"
  fps: 24

voz: bella

